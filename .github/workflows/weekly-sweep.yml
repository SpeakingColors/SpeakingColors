# Every Monday: is CI green in every public repo, and do the hygiene rules still hold (actions pinned, read-only token,
# Dependabot present, strangers locked out)? Red run = something needs a look. Public data only, nothing is changed.
name: weekly-sweep
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sweep every public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sweep.py SpeakingColors
      - name: Keep this schedule alive (GitHub switches scheduled runs off after 60 days without repo activity)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/weekly-sweep.yml/enable
